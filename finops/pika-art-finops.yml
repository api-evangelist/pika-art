description: >-
  FinOps view of Pika spend. There are two distinct cost surfaces. First, the
  pika.art consumer app is sold as flat monthly subscriptions (Free, Standard,
  Pro, Fancy) where each generation draws down a monthly credit balance sized by
  resolution, duration, and mode - a prepaid-credit model, not metered billing.
  Second, programmatic access is NOT sold by Pika: Pika's models are hosted on
  fal.ai (Pika's official inference partner) and billed per generation on fal.
  Published fal rates for Pika 2.1 include roughly $0.40 per text-to-video clip
  (up to 5 seconds at 720p or 1080p) and about $0.20 for a 5-second 720p
  image-to-video clip. Longer durations and higher resolutions cost more.
notes: >-
  Pika does not issue API invoices; developer spend appears on the fal.ai bill.
  Per-generation rates are fal's and vary by model version, resolution, and
  duration - reconcile against fal's live model pages. Consumer subscription
  prices are on pika.art/pricing. Figures captured 2026-07-11.
