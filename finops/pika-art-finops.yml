meters:
- name: subscription_credits
  description: Monthly credits included with a Pika app subscription; each generation consumes credits by resolution, duration, and mode.
  unit: credits
  aggregation: sum
  dimensions:
  - account
  - plan
- name: fal_generation
  description: Per-generation charge on fal.ai for Pika model calls (billed by fal, not Pika). Varies by model version, resolution, and duration.
  unit: generations
  aggregation: sum
  dimensions:
  - fal_account
  - model
  - resolution
  - duration
principles:
- name: Visibility
  description: Track credit burn per Pika app account and, for programmatic use, per-generation spend on the fal.ai dashboard by model, resolution, and duration.
- name: Allocation
  description: Map Pika subscriptions to teams and separate fal API keys/projects per workload so generation spend maps to cost centers.
- name: Optimization
  description: Generate at the lowest resolution and shortest duration that meets quality needs; prefer the credit subscription for steady in-app use and fal per-generation billing for bursty programmatic workloads.
- name: Accountability
  description: Assign an owner to each subscription and each fal project; review monthly credit consumption and fal invoices against budget.
