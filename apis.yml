name: Pika
kind: company
description: >-
  Pika (Pika Labs) is a generative AI video platform that turns text prompts and
  images into short, high-quality videos. Pika is primarily a consumer and
  creator product delivered through its web app at pika.art (and historically a
  Discord bot), with features such as text-to-video, image-to-video, Pikascenes,
  Pikaframes keyframe interpolation, lip sync, and AI sound effects. Pika does
  NOT publish a first-party developer API on its own domain. Its pika.art/api
  page is a landing page that directs developers to fal.ai, Pika's official
  inference partner, which hosts Pika's 2.x video models as callable API
  endpoints (for example fal-ai/pika/v2.2/text-to-video and
  fal-ai/pika/v2.2/image-to-video). Consumer access is sold as credit-based
  monthly subscriptions; programmatic access is billed per generation on fal.
  Various unofficial third-party wrappers (PiAPI, useapi.net, Pollo, and others)
  also resell Pika access but are not operated or endorsed by Pika.
